name: Public profile integrity

on:
  pull_request:
    paths:
      - 'profile/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/profile-check.yml'
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/profile-check.yml'

permissions:
  contents: read

jobs:
  check-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public profile assets, links and policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          profile = Path("profile/README.md").read_text(encoding="utf-8")
          contributing = Path("CONTRIBUTING.md").read_text(encoding="utf-8")
          assert Path("profile/header.svg").is_file(), "Missing banner"
          for svg_path in (
              "profile/header.svg",
              "brand/avatar.svg",
              "brand/mark.svg",
              "brand/lockup-light.svg",
          ):
              asset = Path(svg_path)
              assert asset.is_file(), f"Missing brand asset: {svg_path}"
              tree = ET.parse(asset)
              root = tree.getroot()
              assert root.tag == "{http://www.w3.org/2000/svg}svg"
              titles = root.findall("{http://www.w3.org/2000/svg}title")
              assert len(titles) == 1 and "NOEMETRA" in (titles[0].text or ""), svg_path
              assert "<script" not in asset.read_text(encoding="utf-8"), svg_path
          assert "./header.svg" in profile, "Banner not referenced"
          assert "**NOEMETRA**" in profile, "Brand not present"
          assert "Systems. Signals. Evidence." in profile, "Research triad not present"
          assert Path("brand/README.md").is_file()
          assert Path("brand/MIGRATION.md").is_file()
          for slug in (
              "PAW--Phishing-Attribution-Workbench--",
              "Reverse-Observer",
              "mirage-flow",
              "Chimera",
          ):
              assert f"https://github.com/Northguard-Security/{slug}" in profile, slug
          assert Path("CONTRIBUTING.md").is_file()
          assert "CONTRIBUTING.md" in profile
          assert "explicitly authorized" in profile
          assert "negative controls" in profile
          assert "private vulnerability reporting" in contributing
          print("PROFILE_INTEGRITY_OK")
          PY
